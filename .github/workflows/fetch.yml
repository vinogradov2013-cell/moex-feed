# Раз в час по будням (и раз в день в выходные) — данные Мосбиржи по юаню в data/.
name: fetch

on:
  schedule:
    - cron: "25 * * * 1-5"
    - cron: "25 6 * * 0,6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch
        run: python3 fetch.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Нет изменений"
          else
            git commit -m "data: $(date -u +'%F %H:%M') UTC"
            git push
          fi
