name: diag
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare root CA
        run: |
          echo | openssl s_client -connect iss.moex.com:443 -servername iss.moex.com -showcerts 2>/dev/null | awk '/BEGIN CERT/{n++} n==3{print} /END CERT/&&n==3{exit}' > moex_root.pem
          echo "MOEX root:"; openssl x509 -in moex_root.pem -noout -subject -fingerprint -sha256 || true
          for u in https://gu-st.ru/content/lending/russian_trusted_root_ca_pem.crt https://gu-st.ru/content/Other/doc/russian_trusted_root_ca.cer https://www.gosuslugi.ru/crt; do
            code=$(curl -sS -L -m 30 -o official.cer -w "%{http_code}" "$u" 2>/dev/null || echo fail); echo "$u -> $code"
            openssl x509 -in official.cer -noout -subject -fingerprint -sha256 2>/dev/null || openssl x509 -inform DER -in official.cer -noout -subject -fingerprint -sha256 2>/dev/null || true
          done
          echo "PEM корня от биржи:"; cat moex_root.pem
